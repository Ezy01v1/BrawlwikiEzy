# Nginx delante de Next (127.0.0.1:3000). La API (127.0.0.1:4000) no se expone: solo la consulta Next.
# Reemplazar brawlwiki.example.com por el dominio real. Los certificados los crea certbot (ver deploy/README.md).

limit_req_zone $binary_remote_addr zone=brawlwiki:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name brawlwiki.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name brawlwiki.example.com;

    ssl_certificate     /etc/letsencrypt/live/brawlwiki.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brawlwiki.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets con hash en el nombre: se pueden cachear para siempre.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=brawlwiki burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Next compara el Origin de las Server Actions con X-Forwarded-Host (o Host): los dos con el dominio real.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Se REEMPLAZA (no se agrega) con la IP real: Next lo reenvía a la API, que limita por IP.
        # Con $proxy_add_x_forwarded_for un cliente podría falsificar su IP y saltarse el rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # El callback de login hace dos llamadas a Discord (hasta 8 s cada una; la web espera hasta 20 s).
        proxy_read_timeout 25s;
    }
}
